org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Backend base URL used by the app (your Oracle VM). Change to your VM IP/domain.
# The app also lets you change it at runtime in Settings, stored in DataStore.
planner.backend.url=http://129.225.82.58:25565
# Facebook App ID for Facebook Login (Connect Page). Create the app at
# developers.facebook.com, then put its numeric App ID here (or in
# local.properties, which is not committed). Until this is set, the
# "Connect with Facebook" button shows Facebook's invalid-app-ID error.
planner.facebook.app.id=0
# Facebook client token, from the same Developer app (Settings > Basic >
# Client Token). The SDK refuses to start without it, so it has its own
# placeholder too — both values must be real before login can work.
planner.facebook.client.token=0
